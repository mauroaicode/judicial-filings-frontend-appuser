<!doctype html>
<html lang="en" data-theme="light" id="html-theme">

<head>
  <meta charset="utf-8">
  <title>Procesos Judiciales</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="images/ui/favicon.ico">
  <style>
  #app-boot {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    z-index: 9999;
  }

  #app-boot__spinner {
    width: 2.5rem;
    height: 2.5rem;
    border: 3px solid #e5e7eb;
    border-top-color: #4B2A7D;
    border-radius: 9999px;
    animation: app-boot-spin 0.8s linear infinite;
  }

  @keyframes app-boot-spin {
    to {
      transform: rotate(360deg);
    }
  }
  </style>
</head>

<body>
  <div id="app-boot" aria-hidden="true">
    <div id="app-boot__spinner"></div>
  </div>
  <app-root></app-root>
  <script>
  (function () {
    var CHUNK_RELOAD_KEY = 'notijudicial-chunk-reload';

    function shouldReloadForChunkError(message) {
      if (!message) return false;
      return (
        message.indexOf('Failed to fetch dynamically imported module') !== -1 ||
        message.indexOf('Importing a module script failed') !== -1 ||
        message.indexOf('Loading chunk') !== -1 ||
        message.indexOf('ChunkLoadError') !== -1
      );
    }

    function reloadOnceForStaleAssets() {
      try {
        if (sessionStorage.getItem(CHUNK_RELOAD_KEY)) {
          sessionStorage.removeItem(CHUNK_RELOAD_KEY);
          return;
        }
        sessionStorage.setItem(CHUNK_RELOAD_KEY, '1');
        window.location.reload();
      } catch (error) {
        window.location.reload();
      }
    }

    window.addEventListener('error', function (event) {
      if (shouldReloadForChunkError(event.message)) {
        reloadOnceForStaleAssets();
      }
    });

    window.addEventListener('unhandledrejection', function (event) {
      var reason = event.reason;
      var message = typeof reason === 'string' ? reason : reason && reason.message;
      if (shouldReloadForChunkError(message)) {
        reloadOnceForStaleAssets();
      }
    });
  })();
  </script>
</body>

</html>
