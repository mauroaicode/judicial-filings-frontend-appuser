<div class="flex flex-col md:flex-row gap-6 p-4 md:p-6 lg:p-8 max-w-[1400px] mx-auto h-full">

      <div class="card-body p-4">
        <h2 class="font-bold text-lg mb-4 text-base-content/80">{{ 'navigation.config' | transloco }}</h2>
        <ul class="menu menu-sm bg-base-100 rounded-box p-0 w-full gap-1">
          <li>
            <a routerLink="/config/seguridad" routerLinkActive="active" class="config-nav-link flex gap-3">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />

              </svg>
              {{ 'navigation.notificationChannels' | transloco }}

          </li>
        </ul>
      </div>
    </div>
  </div>

  <!-- Content area -->
  <div class="flex-1 w-full">
    <router-outlet></router-outlet>
  </div>
</div>
