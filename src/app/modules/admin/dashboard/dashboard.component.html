<div class="w-full space-y-6">
  <h1 class="text-2xl font-bold text-base-content md:text-3xl">
    {{ 'dashboard.title' | transloco }}
  </h1>

  <section class="dashboard-stats" aria-labelledby="dashboard-stats-heading">
    <h2 id="dashboard-stats-heading" class="sr-only">
      {{ 'dashboard.stats.title' | transloco }}
    </h2>
    <app-dashboard-stats-cards
      [stats]="stats()"
      [loading]="isLoading()"
      [error]="error()"
      (cardClick)="onStatsCardClick($event)"
    />
  </section>

  <dialog class="modal modal-bottom sm:modal-middle" [class.modal-open]="isManualRegistrationModalOpen()">
    @if (isManualRegistrationModalOpen()) {
      <div class="modal-box p-0 bg-transparent shadow-none border-none max-w-2xl">
        <app-manual-registration-requests-modal
          [open]="isManualRegistrationModalOpen()"
          (closed)="closeManualRegistrationModal()">
        </app-manual-registration-requests-modal>
      </div>
    }
    <form method="dialog" class="modal-backdrop" (click)="closeManualRegistrationModal()">
      <button type="button">close</button>
    </form>
  </dialog>

  <app-notifications-drawer
    (closed)="onNotificationsDrawerClosed()"
    (rowClick)="onNotificationRowClick($event)"
  />
</div>
